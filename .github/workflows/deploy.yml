name: Deploy to Azure

# Requires SCM basic-auth publishing enabled on the App Service:
#   az resource update -g <rg> --name scm --namespace Microsoft.Web \
#     --resource-type basicPublishingCredentialsPolicies \
#     --parent sites/<app> --set properties.allow=true
# (azure/webapps-deploy with a publish profile authenticates via SCM basic auth.)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: exploretree-demo
  PUBLIC_BASE_URL: https://exploretree-demo-a2hze7c2dbabg2bp.eastus2-01.azurewebsites.net
  MCP_WIDGET_ORIGIN: https://1056851e4c3c58250520d82a50fb3a09.widget-renderer.usercontent.microsoft

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Stage deploy package
        run: |
          mkdir -p deploy_pkg/frontend
          cp -r backend/app deploy_pkg/app
          cp backend/requirements.txt deploy_pkg/requirements.txt
          cp -r frontend/dist deploy_pkg/frontend/dist
          printf 'PUBLIC_BASE_URL=%s\nMCP_WIDGET_ORIGIN=%s\n' \
            "$PUBLIC_BASE_URL" "$MCP_WIDGET_ORIGIN" > deploy_pkg/.env

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy_pkg

      - name: Restart Python worker
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          import xml.etree.ElementTree as ET

          root = ET.fromstring(os.environ["PUBLISH_PROFILE"])
          profile = next(
              item
              for item in root.findall("publishProfile")
              if item.attrib.get("publishMethod") == "MSDeploy"
          )
          host = profile.attrib["publishUrl"].split(":", 1)[0]
          credentials = (
              f'{profile.attrib["userName"]}:{profile.attrib["userPWD"]}'
          ).encode()
          headers = {
              "Authorization": "Basic "
              + base64.b64encode(credentials).decode(),
              "Content-Type": "application/json",
          }
          payload = json.dumps(
              {
                  "command": "touch /home/site/config/restartTrigger.txt",
                  "dir": "/home/site/wwwroot",
              }
          ).encode()
          request = urllib.request.Request(
              f"https://{host}/api/command",
              data=payload,
              headers=headers,
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              result = json.load(response)
          if result.get("ExitCode") != 0:
              raise RuntimeError(result.get("Error") or "Restart trigger failed")
          print("Triggered App Service Linux worker restart")
          PY
